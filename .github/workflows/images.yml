name: Images

# Builds Purrlor's three images and publishes them to GitHub's container registry, so a server
# installs by downloading them (deploy/setup.sh, `purrlor update`) instead of building — building
# the web client needs ~4 GB of memory, which a small VPS doesn't have. amd64 and arm64 both: the
# build stages run natively (--platform=$BUILDPLATFORM in each Dockerfile), and only each image's
# small final stage is emulated for the other architecture.
#
# Tags: `latest` (what installs follow) and `sha-<commit>`, to pin or roll back with
# PURRLOR_IMAGE_TAG in .env.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: purrlor-web
            dockerfile: apps/web/Dockerfile
          - name: purrlor-token-server
            dockerfile: services/token-server/Dockerfile
          - name: purrlor-push-gateway
            dockerfile: services/push-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=Purrlor — ${{ matrix.name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
