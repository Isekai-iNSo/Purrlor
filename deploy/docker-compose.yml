# Production deployment: LiveKit + the Matrix-membership-gated token server + the push gateway +
# the Purrlor web client, plus an optional bundled Matrix homeserver. The `matrix` service below (a
# Continuwuity homeserver) sits behind the `matrix` Compose profile: deploy/setup.sh provisions it
# by default and writes COMPOSE_PROFILES=matrix into .env, so every later `up` with that env file
# includes it without remembering a flag. Leave COMPOSE_PROFILES unset (bringing your own
# homeserver) and it's ignored entirely. See docs/voice-architecture.md for how these services fit together, and
# ../.env.example for the variables this file expects.
#
# Run from the repo root: docker compose -f deploy/docker-compose.yml --env-file .env pull
#                    then: docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# token-server, push-gateway, and web are prebuilt by CI (.github/workflows/images.yml) for amd64
# and arm64 and published to GitHub's registry, so a server downloads them instead of building —
# building the web client needs ~4 GB of memory, far more than running it. Each keeps its `build:`
# block too, so `up --build` still builds from this checkout (a fork, a local change, a registry
# this host can't reach).
#
# PURRLOR_IMAGE_PREFIX / PURRLOR_IMAGE_TAG (optional) choose which images: the default is
# ghcr.io/m0nnnna/purrlor-<service>:latest. PURRLOR_IMAGE_TAG can pin a commit (sha-<first 7>).
# Setting PURRLOR_IMAGE_PREFIX to empty uses plain local names (purrlor-web:latest, …) — what a
# `docker load` of images built elsewhere provides (see deploy/update-from-mount.sh).
#
# BIND_ADDR (optional, defaults to 127.0.0.1): the address the four reverse-proxied ports below
# bind to on the host. The default assumes nginx runs on this SAME host (the common case — see
# docs/deployment.md). If nginx instead runs on a separate edge/proxy host and reaches this one
# over a private network (e.g. a WireGuard tunnel, common with a Cloudflare-fronted edge box),
# set BIND_ADDR to this host's address on that private network (e.g. the wg0 interface's IP) so
# the edge host can actually reach these ports — 127.0.0.1 would be unreachable from anywhere but
# this host itself. Never set it to 0.0.0.0 unless this host has no other reason to trust its
# network — these ports have no TLS or auth of their own; nginx is what's meant to provide both.
#
# CONTAINER_PROXY (optional): the containers' own address for that proxy, when it differs from the
# host's — deploy/setup.sh writes http://host.docker.internal:PORT for a proxy on the host's
# loopback (a NekoProxy agent on localhost, say), since a container's localhost is its own. Unset,
# the containers use OUTBOUND_PROXY as it is.
#
# OUTBOUND_PROXY / OUTBOUND_NO_PROXY (optional): for a host that has to reach the internet through
# an HTTP(S) proxy — see .env.example and docs/deployment.md's "Outbound proxy". Only the services
# that actually make outbound requests get it: token-server (OpenID checks against users'
# homeservers), push-gateway (browser push services), and matrix (federation). Their image builds
# get it too, for npm. Unset, every one of these is an empty string, which Node and Continuwuity
# both treat as "no proxy". NODE_USE_ENV_PROXY=1 is what makes Node's fetch and https honor the
# variables at all (Node 22.21+; it's a no-op when they're empty).

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - '${BIND_ADDR:-127.0.0.1}:7880:7880' # HTTP/WebSocket signaling — reverse-proxied over TLS, not public
      # These two carry raw WebRTC media, not HTTP — nginx can't proxy them the way it does 7880,
      # so they're bound to all interfaces by default. If nginx lives on a separate edge host
      # (see BIND_ADDR above), that host needs to relay these two ports through to this one
      # itself (e.g. an nginx `stream {}` block, or plain DNAT) — see docs/deployment.md's
      # "Split edge-proxy + origin" section.
      - '7881:7881' # TCP fallback (privacy browsers that block UDP) — real-time media, can't be proxied
      - '7882:7882/udp' # Single UDP mux port for media — real-time media, can't be proxied
      # Optional TURN relay (IP-hiding hardening, off by default — see livekit.yaml's turn:
      # block and docs/deployment.md). Always published, same reasoning as 7881/7882 above:
      # harmless to expose when unused, since nothing listens here unless turn.enabled is true.
      - '5349:5349' # TURN-over-TLS signaling
      - '3478:3478/udp' # TURN media
    environment:
      # Overrides the placeholder keys: section in livekit.yaml — .env is the single source of
      # truth for the key pair, shared with the token-server service below.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    command: >
      --config /etc/livekit.yaml
      --node-ip=${HOST_IP}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      # Only populated when TURN hardening is enabled (deploy/setup.sh copies the TLS cert/key
      # here from certbot's output — see deploy/livekit-certs/.gitkeep) — empty otherwise, which
      # is fine since livekit.yaml's turn: block is disabled by default and never reads these.
      - ./livekit-certs:/etc/livekit/certs:ro
    networks:
      - purrlor-voice

  token-server:
    image: ${PURRLOR_IMAGE_PREFIX-ghcr.io/m0nnnna/}purrlor-token-server:${PURRLOR_IMAGE_TAG:-latest}
    extra_hosts:
      - host.docker.internal:host-gateway
    build:
      context: ..
      dockerfile: services/token-server/Dockerfile
      extra_hosts:
        - host.docker.internal:host-gateway
      args:
        HTTP_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
        HTTPS_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
        NO_PROXY: ${OUTBOUND_NO_PROXY:-}
    restart: unless-stopped
    ports:
      - '${BIND_ADDR:-127.0.0.1}:3001:3001' # reverse-proxied over TLS, not public
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - PORT=3001
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - MATRIX_HOMESERVER_URL=${MATRIX_HOMESERVER_URL}
      # Bot login: either MATRIX_BOT_ACCESS_TOKEN + MATRIX_BOT_USER_ID, or MATRIX_BOT_USERNAME +
      # MATRIX_BOT_PASSWORD (see services/token-server/src/membership.ts) — set whichever pair
      # you're using in .env; the unset pair's vars are just empty strings here, which the token
      # server treats as "not provided" and falls through to the other pair.
      - MATRIX_BOT_USER_ID=${MATRIX_BOT_USER_ID}
      - MATRIX_BOT_ACCESS_TOKEN=${MATRIX_BOT_ACCESS_TOKEN}
      - MATRIX_BOT_USERNAME=${MATRIX_BOT_USERNAME}
      - MATRIX_BOT_PASSWORD=${MATRIX_BOT_PASSWORD}
      - VOICE_MODERATOR_POWER_LEVEL=${VOICE_MODERATOR_POWER_LEVEL:-50}
      - VOICE_ALLOWED_SPACES=${VOICE_ALLOWED_SPACES:-}
      - HTTP_PROXY=${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
      - HTTPS_PROXY=${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
      - NO_PROXY=${OUTBOUND_NO_PROXY:-}
      - NODE_USE_ENV_PROXY=1
    depends_on:
      - livekit
    networks:
      - purrlor-voice

  push-gateway:
    image: ${PURRLOR_IMAGE_PREFIX-ghcr.io/m0nnnna/}purrlor-push-gateway:${PURRLOR_IMAGE_TAG:-latest}
    extra_hosts:
      - host.docker.internal:host-gateway
    build:
      context: ..
      dockerfile: services/push-gateway/Dockerfile
      extra_hosts:
        - host.docker.internal:host-gateway
      args:
        HTTP_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
        HTTPS_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
        NO_PROXY: ${OUTBOUND_NO_PROXY:-}
    restart: unless-stopped
    ports:
      - '${BIND_ADDR:-127.0.0.1}:3002:3002' # reverse-proxied over TLS, not public
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - PORT=3002
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - HTTP_PROXY=${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
      - HTTPS_PROXY=${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
      - NO_PROXY=${OUTBOUND_NO_PROXY:-}
      - NODE_USE_ENV_PROXY=1
    networks:
      - purrlor-voice

  web:
    image: ${PURRLOR_IMAGE_PREFIX-ghcr.io/m0nnnna/}purrlor-web:${PURRLOR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      extra_hosts:
        - host.docker.internal:host-gateway
      args:
        HTTP_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
        HTTPS_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
        NO_PROXY: ${OUTBOUND_NO_PROXY:-}
    restart: unless-stopped
    ports:
      - '${BIND_ADDR:-127.0.0.1}:8080:80' # reverse-proxied over TLS, not public
    environment:
      # Locks the login/register screens to this one homeserver (apps/web/src/app/runtimeConfig.ts).
      # Unset: they ask for one, as a general-purpose Matrix client would.
      - PURRLOR_HOMESERVER_URL=${PURRLOR_HOMESERVER_URL:-}
      # This deployment's voice server and push gateway, so Spaces and accounts on it work without
      # anyone pasting URLs into settings (apps/web/src/matrix/deploymentDefaults.ts). Unset: set
      # them per Space / per account in the app instead.
      - PURRLOR_LIVEKIT_URL=${PURRLOR_LIVEKIT_URL:-}
      - PURRLOR_TOKEN_ENDPOINT=${PURRLOR_TOKEN_ENDPOINT:-}
      - PURRLOR_PUSH_GATEWAY_URL=${PURRLOR_PUSH_GATEWAY_URL:-}
    depends_on:
      - token-server
      - push-gateway
    networks:
      - purrlor-voice

  # Optional bundled Matrix homeserver (Continuwuity — a lightweight, spec-compliant Rust
  # homeserver) for deploy/setup.sh's "provision a homeserver too" path. Entirely inert unless
  # started with `--profile matrix`; MATRIX_SERVER_NAME/MATRIX_REGISTRATION_TOKEN are unset (and
  # this service simply doesn't exist) for anyone bringing their own homeserver. See
  # docs/deployment.md's "Option B" section for the full account-creation flow this feeds into —
  # short version: the FIRST account ever registered must use a one-time bootstrap token
  # Continuwuity itself generates and logs on first startup (NOT this configured token, which only
  # activates once that first account exists — confirmed live against a real container), so
  # setup.sh reads that bootstrap token out of `docker compose logs` for the admin account, then
  # uses MATRIX_REGISTRATION_TOKEN below for every registration after that (the token-server's bot
  # account included).
  matrix:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    profiles: ['matrix']
    # Email verification for new accounts, when it's on: `purrlor email setup` writes this file
    # (mail server, sender, "require an email to sign up") and `purrlor email off` removes it. A
    # file rather than variables here because Continuwuity won't start on a blank mail setting.
    env_file:
      - path: ../matrix-email.env
        required: false
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    ports:
      - '${BIND_ADDR:-127.0.0.1}:8008:8008' # reverse-proxied over TLS (both 443 and 8448), not public
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 8008
      # Invite-only by default: signing up needs MATRIX_REGISTRATION_TOKEN (the web client asks for
      # it). MATRIX_ALLOW_REGISTRATION=false closes sign-up entirely once setup.sh has created its
      # two accounts; the admin can still create users from the admin room.
      CONTINUWUITY_ALLOW_REGISTRATION: ${MATRIX_ALLOW_REGISTRATION:-true}
      CONTINUWUITY_REGISTRATION_TOKEN: ${MATRIX_REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: 'true'
      # Continuwuity appends a suffix (a flag emoji, by default) to the display name of every new
      # account. Off here, so names come out exactly as people type them; set
      # MATRIX_NEW_USER_DISPLAYNAME_SUFFIX in .env to bring one back.
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ${MATRIX_NEW_USER_DISPLAYNAME_SUFFIX:-}
      # Continuwuity's HTTP client honors the standard variables (verified against a logging proxy:
      # federation lookups arrive as CONNECTs).
      HTTP_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
      HTTPS_PROXY: ${CONTAINER_PROXY:-${OUTBOUND_PROXY:-}}
      NO_PROXY: ${OUTBOUND_NO_PROXY:-}
    volumes:
      - matrix-db:/var/lib/continuwuity
      # Docker's default embedded DNS resolver causes federation lookup timeouts for Continuwuity
      # (documented upstream behavior, not specific to this deployment) — mounting a real
      # resolv.conf works around it. `purrlor` writes it from this server's own DNS settings
      # before every start (write_matrix_resolv); a missing file is an error rather than Docker
      # quietly creating an empty directory in its place.
      - type: bind
        source: ../matrix-resolv.conf
        target: /etc/resolv.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - purrlor-voice

networks:
  purrlor-voice:
    driver: bridge

volumes:
  matrix-db:
